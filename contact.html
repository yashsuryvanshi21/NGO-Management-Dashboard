<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Narayan Seva Sansthan</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="css/dashboard.css"></head><body class="contact-page"><main class="contact-shell"><a class="portal-home" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to website</a><section class="contact-intro"><span class="portal-mark"><i class="fa-solid fa-hand-holding-heart"></i></span><p class="eyebrow">Get in touch</p><h1>Let’s make an impact together.</h1><p>Have a question about our work, a campaign, or ways to support? Our team would love to hear from you.</p><div><span><i class="fa-solid fa-location-dot"></i> Udaipur, Rajasthan, India</span><span><i class="fa-regular fa-clock"></i> Mon–Sat, 9:00 AM–6:00 PM</span></div></section><section class="contact-form-card"><h2>Send a message</h2><p>We typically respond within two working days.</p><form id="contactForm" class="portal-form"><label for="contactName">Your name</label><input id="contactName" required autocomplete="name" placeholder="Full name"><label for="contactEmail">Email address</label><input id="contactEmail" type="email" required autocomplete="email" placeholder="you@example.com"><label for="contactMessage">How can we help?</label><textarea id="contactMessage" rows="5" required placeholder="Write your message here"></textarea><button class="btn btn-success" type="submit">Send message <i class="fa-solid fa-paper-plane"></i></button></form></section></main><script src="js/app.js"></script><script>document.querySelector('#contactForm').addEventListener('submit',event=>{event.preventDefault();if(!event.currentTarget.reportValidity())return;const messages=App.read('nss.messages');messages.unshift({name:document.querySelector('#contactName').value.trim(),email:document.querySelector('#contactEmail').value.trim(),message:document.querySelector('#contactMessage').value.trim(),date:new Date().toISOString()});App.write('nss.messages',messages);event.currentTarget.reset();App.toast('Thank you. Your message has been saved.');});</script></body></html>
